services:
  postgres:
    image: postgres:16-alpine
    container_name: lockbox-postgres
    environment:
      POSTGRES_DB: lockbox
      POSTGRES_USER: lockbox
      POSTGRES_PASSWORD: lockbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lockbox -d lockbox" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lockbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-lockbox}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-lockbox-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "mc ready local || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: lockbox-app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lockbox
      DB_USER: lockbox
      DB_PASSWORD: lockbox
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-lockbox}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-lockbox-secret}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
  minio-data:
