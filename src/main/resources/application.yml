spring:
  application:
    name: lockbox
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lockbox}
    username: ${DB_USER:lockbox}
    password: ${DB_PASSWORD:lockbox}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

vaadin:
  launch-browser: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    dev.lockbox: INFO
