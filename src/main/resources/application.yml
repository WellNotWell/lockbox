spring:
  application:
    name: lockbox
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lockbox}
    username: ${DB_USER:lockbox}
    password: ${DB_PASSWORD:lockbox}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      persistent: false
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

vaadin:
  launch-browser: false

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:lockbox}
  secret-key: ${STORAGE_SECRET_KEY:lockbox-secret}
  bucket: ${STORAGE_BUCKET:lockbox}
  max-attachment-size: 50MB
  staging-ttl: PT6H

lockbox:
  crypto:
    argon2-memory-kb: ${CRYPTO_MEMORY_KB:65536}
    argon2-iterations: ${CRYPTO_ITERATIONS:3}
    argon2-parallelism: ${CRYPTO_PARALLELISM:1}
    salt-length: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    dev.lockbox: INFO
