name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and version
        run: |
          echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check that the tag matches the project version
        run: |
          pom=$(python3 -c "import xml.etree.ElementTree as E; n={'m':'http://maven.apache.org/POM/4.0.0'}; print(E.parse('pom.xml').getroot().find('m:version', n).text)")
          if [ "$pom" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $pom in pom.xml"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Extract jar from the image
        run: |
          container=$(docker create "$IMAGE:$VERSION")
          docker cp "$container:/app/app.jar" "lockbox-$VERSION.jar"
          docker rm "$container"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME"
          {
            printf 'Docker image: `%s:%s`\n\n' "$IMAGE" "$VERSION"
            printf '```bash\n'
            printf 'curl -O %s/docker-compose.release.yml\n' "$raw"
            printf 'curl -o .env %s/.env.example\n' "$raw"
            printf 'LOCKBOX_VERSION=%s docker compose -f docker-compose.release.yml up -d\n' "$VERSION"
            printf '```\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Lockbox $VERSION" \
            --generate-notes \
            --notes "$(cat notes.md)" \
            docker-compose.release.yml \
            .env.example \
            "lockbox-$VERSION.jar"
