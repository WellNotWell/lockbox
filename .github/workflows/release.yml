name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish again
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve image name and version
        run: |
          echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check that the tag matches the project version
        run: |
          pom=$(python3 -c "import xml.etree.ElementTree as E; n={'m':'http://maven.apache.org/POM/4.0.0'}; print(E.parse('pom.xml').getroot().find('m:version', n).text)")
          if [ "$pom" != "$VERSION" ]; then
            echo "tag $TAG does not match the project version $pom in pom.xml"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push the image for amd64 and arm64
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --name multi --driver docker-container --use 2>/dev/null || docker buildx use multi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .

      - name: Extract the jar from the image
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$VERSION"
          container=$(docker create --platform linux/amd64 "$IMAGE:$VERSION")
          docker cp "$container:/app/app.jar" "lockbox-$VERSION.jar"
          docker rm "$container"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .env.example env.example
          assets="docker-compose.release.yml env.example lockbox-$VERSION.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
            gh release delete-asset "$TAG" default.env.example --yes 2>/dev/null || true
          else
            raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG"
            {
              printf 'Docker image: `%s:%s`\n\n' "$IMAGE" "$VERSION"
              printf '```bash\n'
              printf 'curl -O %s/docker-compose.release.yml\n' "$raw"
              printf 'curl -o .env %s/.env.example\n' "$raw"
              printf 'LOCKBOX_VERSION=%s docker compose -f docker-compose.release.yml up -d\n' "$VERSION"
              printf '```\n'
            } > notes.md
            gh release create "$TAG" --title "Lockbox $VERSION" --generate-notes --notes "$(cat notes.md)" $assets
          fi
